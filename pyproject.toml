[project]
name = "dpx-rust"
version = "0.1.0"
description = "Fast Rust (2015-2024 edition) Design Pattern & Architecture Scanner (23 GoF, Typestate, RAII/Drop, Newtype, MPSC/Actor, SOLID, Safety Guard)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "bivex" }
]
keywords = [
    "rust",
    "static-analysis",
    "ast",
    "design-patterns",
    "typestate",
    "raii",
    "solid",
    "clean-architecture",
    "code-quality",
    "safety",
    "linter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Compilers",
]
requires-python = ">=3.10"
dependencies = [
    "antlr4-python3-runtime>=4.13.0,<4.14.0",
    "pydantic>=2.10.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/bivex/DPX-Rust"
Repository = "https://github.com/bivex/DPX-Rust"
Issues = "https://github.com/bivex/DPX-Rust/issues"

[project.scripts]
dpx = "pattern_detector.adapters.inbound.cli.main:main"
dpx-rust = "pattern_detector.adapters.inbound.cli.main:main"
pattern-detector = "pattern_detector.adapters.inbound.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pattern_detector"]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
